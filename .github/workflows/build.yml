---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  compile:
    name: 'Compile for the Emotion Engine'
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/ps2dev/ps2dev:latest'
    steps:
      - name: 'Install build dependencies'
        # The image carries the toolchain and the SDK. CMake, Ninja, and git are added here rather
        # than assumed, because the image exists to provide the cross compiler.
        run: apk add --no-cache build-base cmake git ninja
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          echo "PS2SDK=$PS2SDK"
          echo "PS2DEV=$PS2DEV"
          mips64r5900el-ps2-elf-g++ --version
          cmake --version
      - name: 'Configure'
        # The reconstruction compiles into an object library and is never linked, because the tree
        # is partial and no link can succeed until every routine a call reaches has a body.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PS2SDK/ps2dev.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: 'Compile'
        run: cmake --build build --target resonance_objects
      - name: 'Object count'
        # A build that compiled nothing also reports success, so the object count is recorded.
        run: |
          COUNT=$(find build -name '*.o' | wc -l)
          echo "Compiled $COUNT object file(s)"
          test "$COUNT" -gt 0
name: 'Build'
'on':
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
permissions:
  contents: read
