---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  compile:
    name: 'Compile'
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/ps2dev/ps2dev:latest'
    steps:
      - name: 'Install build dependencies'
        run: apk add --no-cache build-base cmake git ninja
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          echo "PS2SDK=$PS2SDK"
          echo "PS2DEV=$PS2DEV"
          mips64r5900el-ps2-elf-g++ --version
          cmake --version
      - name: 'Configure'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PS2SDK/ps2dev.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: 'Compile'
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          cmake --build build --target archives -- -k 0 2>&1 | tee build/compile.log
      - name: 'Count produced artifacts'
        if: always()
        run: |
          OBJECTS=$(find build '(' -name '*.o' -o -name '*.obj' ')' | wc -l)
          ARCHIVES=$(find build -name '*.a' | wc -l)
          # grep yields an empty string rather than a zero when the log is absent. That happens
          # whenever an earlier step failed and this one still runs.
          ERRORS=$(grep -c 'error:' build/compile.log || true)
          ERRORS=${ERRORS:-0}
          {
            echo "## Emotion Engine build"
            echo
            echo "| Measure | Count |"
            echo "| --- | --- |"
            echo "| Object files | $OBJECTS |"
            echo "| Archives | $ARCHIVES |"
            echo "| Compiler errors | $ERRORS |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Compiled $OBJECTS object file(s) into $ARCHIVES archive(s), $ERRORS error(s)"
          find build -name '*.a' | sort
          test "$OBJECTS" -gt 0
      - name: 'Upload archives'
        if: always()
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
        with:
          name: archives
          path: 'build/**/*.a'
          if-no-files-found: warn
name: 'Build'
'on':
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
permissions:
  contents: read
