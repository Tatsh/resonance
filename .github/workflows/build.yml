---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  compile:
    name: 'Compile for the Emotion Engine'
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/ps2dev/ps2dev:latest'
    steps:
      - name: 'Install build dependencies'
        # The image carries the toolchain and the SDK. CMake, Ninja, and git are added here rather
        # than assumed, because the image exists to provide the cross compiler.
        run: apk add --no-cache build-base cmake git ninja
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          echo "PS2SDK=$PS2SDK"
          echo "PS2DEV=$PS2DEV"
          mips64r5900el-ps2-elf-g++ --version
          cmake --version
      - name: 'Configure'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PS2SDK/ps2dev.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: 'Compile'
        # Keep going past a failing source rather than stopping at the first one. The goal at this
        # stage is the object files and the archives the reconstruction can already produce, and a
        # build halting on source one reports nothing about the other 334.
        #
        # -k belongs to Ninja rather than to cmake --build, so it goes after the separator. Given to
        # cmake it is an unknown argument, and the step then logs a usage message and compiles
        # nothing while still appearing to have run.
        #
        # The matcher turns each compiler line into an annotation, which is readable without
        # repository rights where a run log and an artifact both need them.
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          cmake --build build --target archives -- -k 0 2>&1 | tee build/compile.log
      - name: 'Count what was produced'
        if: always()
        run: |
          OBJECTS=$(find build -name '*.o' | wc -l)
          ARCHIVES=$(find build -name '*.a' | wc -l)
          ERRORS=$(grep -c 'error:' build/compile.log || true)
          {
            echo "## Emotion Engine build"
            echo
            echo "| Measure | Count |"
            echo "| --- | --- |"
            echo "| Object files | $OBJECTS |"
            echo "| Archives | $ARCHIVES |"
            echo "| Compiler errors | $ERRORS |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Compiled $OBJECTS object file(s) into $ARCHIVES archive(s), $ERRORS error(s)"
          find build -name '*.a' | sort
          test "$OBJECTS" -gt 0
      - name: 'Upload the archives'
        if: always()
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
        with:
          name: archives
          path: 'build/**/*.a'
          if-no-files-found: warn
name: 'Build'
'on':
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
permissions:
  contents: read
